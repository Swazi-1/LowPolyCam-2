name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show XcodeGen version
        run: xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 was not found on this runner." >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"

      - name: Show build environment
        run: xcodebuild -version

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Compile unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Run unit tests when a simulator is available
        run: |
          set -euo pipefail
          # Initialize CoreSimulator before asking xcodebuild for destinations. On some
          # macOS-15 runners the service starts with only the placeholder destination exposed.
          if ! xcrun simctl list devices available >/dev/null 2>&1; then
            echo "::warning::CoreSimulator is unavailable; the test bundle was compiled, so simulator execution is skipped."
            exit 0
          fi

          if ! DESTINATION_OUTPUT=$(xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Debug \
            -showdestinations 2>&1); then
            echo "::warning::xcodebuild could not enumerate simulator destinations; the test bundle was compiled, so execution is skipped."
            printf '%s\n' "$DESTINATION_OUTPUT" >&2
            exit 0
          fi
          DESTINATION_LINE=$(printf '%s\n' "$DESTINATION_OUTPUT" | awk '/platform:iOS Simulator/ && /name:iPhone/ && /id:/ {print; exit}')
          SIMULATOR_ID=$(printf '%s\n' "$DESTINATION_LINE" | awk -F'id:' '{split($2, parts, ","); gsub(/^[[:space:]]+/, "", parts[1]); gsub(/[[:space:]}]+$/, "", parts[1]); print parts[1]; exit}')

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No existing Xcode-compatible iPhone simulator was found; creating a temporary one."
            DEVICE_TYPE=$(xcrun simctl list devicetypes available | awk '/iPhone/ {for (field = 1; field <= NF; field++) if ($field ~ /com\.apple\.CoreSimulator\.SimDeviceType\.iPhone/) {gsub(/[()]/, "", $field); print $field; exit}}')
            IOS_RUNTIME=$(xcrun simctl list runtimes available | awk '/^iOS [0-9]/ && /available/ {for (field = 1; field <= NF; field++) if ($field ~ /com\.apple\.CoreSimulator\.SimRuntime\.iOS/) {gsub(/[()]/, "", $field); print $field; exit}}')
            if [ -z "$DEVICE_TYPE" ] || [ -z "$IOS_RUNTIME" ]; then
              echo "::warning::CoreSimulator has no available iPhone device type or iOS runtime; the test bundle was compiled, so execution is skipped."
              xcrun simctl list devicetypes >&2 || true
              xcrun simctl list runtimes >&2 || true
              exit 0
            fi
            if ! SIMULATOR_ID=$(xcrun simctl create "LowPolyCam CI iPhone" "$DEVICE_TYPE" "$IOS_RUNTIME"); then
              echo "::warning::CoreSimulator could not create a temporary iPhone; the test bundle was compiled, so execution is skipped."
              exit 0
            fi
            trap 'xcrun simctl shutdown "$SIMULATOR_ID" >/dev/null 2>&1 || true; xcrun simctl delete "$SIMULATOR_ID" >/dev/null 2>&1 || true' EXIT
          fi

          xcrun simctl boot "$SIMULATOR_ID" >/dev/null 2>&1 || true
          if ! xcrun simctl bootstatus "$SIMULATOR_ID" -b; then
            echo "::warning::CoreSimulator could not boot the selected iPhone; the test bundle was compiled, so execution is skipped."
            xcrun simctl list devices >&2 || true
            exit 0
          fi
          if [ -z "$DESTINATION_LINE" ]; then
            DESTINATION_LINE="created simulator id:$SIMULATOR_ID"
          fi
          echo "Testing on iOS Simulator destination: $DESTINATION_LINE"
          TEST_OUTPUT=$(mktemp)
          if xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test-without-building 2>&1 | tee "$TEST_OUTPUT"; then
            :
          else
            if grep -qiE 'Unable to find a destination matching|No devices are available|The requested device could not be found|CoreSimulatorService' "$TEST_OUTPUT"; then
              echo "::warning::The hosted runner could not execute the selected simulator destination; the test bundle was compiled, so execution is skipped."
              exit 0
            fi
            exit 1
          fi

      - name: Verify Files integration
        run: |
          set -euo pipefail
          APP_INFO="build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app/Info.plist"
          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP_INFO")
            if [ "$VALUE" != "true" ]; then
              echo "$KEY must be true in the built app Info.plist, got: $VALUE" >&2
              exit 1
            fi
          done
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO")
          if [ "$SHORT_VERSION" != "5.0.12" ] || [ "$BUILD_VERSION" != "517" ]; then
            echo "Unexpected app version: $SHORT_VERSION ($BUILD_VERSION)" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_INFO" >/dev/null
          plutil -lint "$APP_INFO"
          APP_BINARY="build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app/LowPolyCam"
          lipo -info "$APP_BINARY" | grep -q arm64

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app build/Payload/
          cd build
          zip -r LowPolyCam-unsigned.ipa Payload
          unzip -t LowPolyCam-unsigned.ipa
          shasum -a 256 LowPolyCam-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LowPolyCam-unsigned-ipa
          path: build/LowPolyCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
