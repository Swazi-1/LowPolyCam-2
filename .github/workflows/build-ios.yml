name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show build environment
        run: xcodebuild -version

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app build/Payload/
          cd build
          zip -r LowPolyCam-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LowPolyCam-unsigned-ipa
          path: build/LowPolyCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
