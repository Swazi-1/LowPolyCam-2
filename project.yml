name: LowPolyCam
options:
  bundleIdPrefix: com.swazi
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LowPolyCam:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swazi.LowPolyCam
        MARKETING_VERSION: "4.3.1"
        CURRENT_PROJECT_VERSION: "431"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
