name: LowPolyCam
options:
  bundleIdPrefix: com.swazi
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LowPolyCam:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swazi.LowPolyCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LowPolyCam
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: LowPolyCam uses the camera to take photos and record videos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: LowPolyCam uses the microphone to record audio with your videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: LowPolyCam saves your photos and recorded videos to Photos.
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
